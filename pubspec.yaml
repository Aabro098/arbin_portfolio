name: arbin_portfolio
description: "Personal portfolio of Arbin Shrestha, Flutter Developer and Software Engineer from Nepal."
publish_to: 'none'

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  auto_size_text: ^3.0.0
  cupertino_icons: ^1.0.8
  custom_button_builder: ^0.0.4
  device_frame: ^1.2.0
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10+1
  font_awesome_flutter: ^10.7.0
  google_fonts: ^9.0.0
  lottie: ^3.3.1
  provider: ^6.1.2
  rive: ^0.13.15
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter

  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/rive/
    - assets/logos/
